name: CI DevOps Tasks Board

# Déclenché sur chaque push ou PR vers une branche feature ou main
on:
  push:
    branches: ["feature/*", "main"]
  pull_request:
    branches: ["feature/*", "main"]

jobs:
  # ── 1er job : lint ──────────────────────────────────────────────────────────
  # Vérifie la qualité du code avant de lancer les tests.
  # Si le lint échoue, les jobs suivants ne s'exécutent pas (fail fast).
  lint:
    name: Lint (backend & frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Lint backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      # Lint frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

  # ── 2ème job : backend ──────────────────────────────────────────────────────
  # Lance les tests unitaires du backend (Jest + Supertest).
  # Bloqué tant que le job lint n'est pas vert.
  backend:
    name: Backend - tests
    runs-on: ubuntu-latest
    needs: lint  # dépend du job lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  # ── 3ème job : frontend ─────────────────────────────────────────────────────
  # Lance les tests (Vitest) puis le build de production.
  # Le build valide qu'il n'y a pas d'erreur de compilation avant un déploiement.
  frontend:
    name: Frontend - tests & build
    runs-on: ubuntu-latest
    needs: backend  # dépend du job backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build