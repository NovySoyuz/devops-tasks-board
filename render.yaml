services:
  # Backend Node.js
  - type: web
    name: devops-tasks-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH0_DOMAIN
        value: dev-iazccw3gseusnctx.eu.auth0.com
      - key: AUTH0_AUDIENCE
        value: https://devops-tasks-api
      - key: DATABASE_URL
        sync: false  # à renseigner manuellement dans le dashboard Render

  # Frontend React (site statique)
  - type: web
    name: devops-tasks-frontend
    env: static
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AUTH0_DOMAIN
        value: dev-iazccw3gseusnctx.eu.auth0.com
      - key: VITE_AUTH0_CLIENT_ID
        value: F1m7hqlwUsAdxVXTYvfhE7fsn4IlyvBz
      - key: VITE_AUTH0_AUDIENCE
        value: https://devops-tasks-api
      - key: VITE_API_URL
        sync: false  # à renseigner avec l'URL du backend après déploiement
