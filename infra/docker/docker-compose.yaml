# infra/docker/docker-compose.yml
version: "3.9"
services:
  db:
    image: postgres:15
    container_name: devops_tasks_db
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - devops_net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: devops_tasks_backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://devops:${POSTGRES_PASSWORD}@db:5432/tasksdb
      NODE_ENV: development
      AUTH0_DOMAIN: dev-iazccw3gseusnctx.eu.auth0.com
      AUTH0_AUDIENCE: https://devops-tasks-api
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      - db
    ports:
      - "3000:3000"
    networks:
      - devops_net

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: devops_tasks_frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_AUTH0_DOMAIN: dev-iazccw3gseusnctx.eu.auth0.com
      VITE_AUTH0_CLIENT_ID: F1m7hqlwUsAdxVXTYvfhE7fsn4IlyvBz
      VITE_AUTH0_AUDIENCE: https://devops-tasks-api
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - devops_net

volumes:
  db_data:

networks:
  devops_net:
    driver: bridge