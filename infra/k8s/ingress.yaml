# Ingress API : strip /api avant de transmettre au backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tasks-ingress-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - secretName: devops-tasks-tls
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
---
# Ingress Frontend : toutes les autres routes vers le frontend React
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tasks-ingress-frontend
spec:
  tls:
    - secretName: devops-tasks-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173