# Ingress API : strip /api avant de transmettre au backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tasks-ingress-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  tls:
    - secretName: devops-tasks-tls
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
---
# Ingress Keycloak : /realms, /admin, /resources, /js routés vers Keycloak
# Le TLS est terminé par Nginx, Keycloak reçoit du HTTP interne
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tasks-ingress-keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  tls:
    - secretName: devops-tasks-tls
  rules:
    - http:
        paths:
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
---
# Ingress Frontend : toutes les autres routes vers le frontend React
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-tasks-ingress-frontend
spec:
  tls:
    - secretName: devops-tasks-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 5173